<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <title>Neon Arena architecture</title>
  <desc>Webcam to MediaPipe in the browser, calibration and move detection, the game with latency leads, a rule-based coach in the browser; the browser saves round numbers to Supabase and asks the coach endpoint, which reads Supabase with the player's token and calls Claude only when a key is set.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c4fc40" />
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22d3ee" />
    </marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa6b5" />
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#07090d" />

  <!-- The laptop: everything with video stays inside this box -->
  <rect x="40" y="40" width="960" height="820" rx="28" fill="none" stroke="#c4fc40" stroke-width="4" stroke-dasharray="18 12" />
  <text x="80" y="102" font-size="40" font-weight="700" fill="#c4fc40">Your laptop · Chrome</text>
  <text x="80" y="830" font-size="36" font-weight="700" fill="#f5f7fa">Video never leaves the laptop</text>

  <!-- Pose chain -->
  <rect x="80" y="140" width="420" height="110" rx="18" fill="#141a22" stroke="#3a4656" stroke-width="2" />
  <text x="290" y="208" font-size="40" font-weight="700" fill="#f5f7fa" text-anchor="middle">Webcam</text>

  <rect x="80" y="300" width="420" height="110" rx="18" fill="#141a22" stroke="#3a4656" stroke-width="2" />
  <text x="290" y="368" font-size="38" font-weight="700" fill="#f5f7fa" text-anchor="middle">MediaPipe pose</text>

  <rect x="80" y="460" width="420" height="130" rx="18" fill="#141a22" stroke="#3a4656" stroke-width="2" />
  <text x="290" y="515" font-size="36" font-weight="700" fill="#f5f7fa" text-anchor="middle">Calibration +</text>
  <text x="290" y="560" font-size="36" font-weight="700" fill="#f5f7fa" text-anchor="middle">move detection</text>

  <rect x="80" y="640" width="420" height="130" rx="18" fill="#141a22" stroke="#c4fc40" stroke-width="3" />
  <text x="290" y="695" font-size="38" font-weight="700" fill="#c4fc40" text-anchor="middle">The game</text>
  <text x="290" y="740" font-size="30" fill="#f5f7fa" text-anchor="middle">draws early by measured lag</text>

  <line x1="290" y1="250" x2="290" y2="296" stroke="#c4fc40" stroke-width="5" marker-end="url(#a)" />
  <line x1="290" y1="410" x2="290" y2="456" stroke="#c4fc40" stroke-width="5" marker-end="url(#a)" />
  <line x1="290" y1="590" x2="290" y2="636" stroke="#c4fc40" stroke-width="5" marker-end="url(#a)" />

  <!-- Rule-based coach, in the browser -->
  <rect x="560" y="640" width="400" height="130" rx="18" fill="#141a22" stroke="#3a4656" stroke-width="2" />
  <text x="760" y="695" font-size="34" font-weight="700" fill="#f5f7fa" text-anchor="middle">Rule-based coach</text>
  <text x="760" y="740" font-size="30" fill="#9aa6b5" text-anchor="middle">today's coach card</text>

  <!-- Server side -->
  <rect x="1100" y="140" width="460" height="200" rx="18" fill="#141a22" stroke="#22d3ee" stroke-width="3" />
  <text x="1330" y="210" font-size="40" font-weight="700" fill="#22d3ee" text-anchor="middle">Supabase</text>
  <text x="1330" y="262" font-size="30" fill="#f5f7fa" text-anchor="middle">row-level security,</text>
  <text x="1330" y="304" font-size="30" fill="#f5f7fa" text-anchor="middle">leaderboard view</text>

  <rect x="1100" y="440" width="460" height="130" rx="18" fill="#141a22" stroke="#22d3ee" stroke-width="3" />
  <text x="1330" y="520" font-size="36" font-weight="700" fill="#f5f7fa" text-anchor="middle">Coach endpoint</text>

  <rect x="1100" y="680" width="460" height="130" rx="18" fill="none" stroke="#9aa6b5" stroke-width="3" stroke-dasharray="14 10" />
  <text x="1330" y="738" font-size="34" font-weight="700" fill="#9aa6b5" text-anchor="middle">Claude</text>
  <text x="1330" y="782" font-size="28" fill="#9aa6b5" text-anchor="middle">when a key is set</text>

  <!-- Browser to server: numbers only -->
  <path d="M500 700 C 760 560, 820 260, 1096 240" fill="none" stroke="#22d3ee" stroke-width="5" marker-end="url(#b)" />
  <text x="690" y="300" font-size="32" font-weight="700" fill="#22d3ee" text-anchor="middle">scores, reps</text>
  <line x1="960" y1="660" x2="1096" y2="540" stroke="#22d3ee" stroke-width="5" marker-end="url(#b)" />
  <!-- Endpoint reads history under RLS; calls Claude only with a key -->
  <line x1="1330" y1="440" x2="1330" y2="344" stroke="#22d3ee" stroke-width="5" marker-end="url(#b)" />
  <line x1="1330" y1="570" x2="1330" y2="676" stroke="#9aa6b5" stroke-width="5" stroke-dasharray="12 10" marker-end="url(#c)" />
</svg>
